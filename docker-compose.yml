services:
  velospbot:
    build:
      ./velospbot
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./velospbot:/velospbot
      - /velospbot/node_modules # 'volume mount'
    command: npm run dev

  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx_config.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./html:/var/www/html