events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name matveymatvey.ru;

        location / {
            return 301 https://$host$request_uri;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    server {
        listen 443 ssl http2;
        server_name matveymatvey.ru;
        
        ssl_certificate     /etc/letsencrypt/live/matveymatvey.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matveymatvey.ru/privkey.pem;

        location /velospbot/ {
            proxy_pass http://velospbot:3000/velospbot/;
            rewrite ^/velospbot/(.*)$ /$1 break;
            proxy_set_header Host  $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /velospbot/_next/ {
        #     alias /path/to/your/nextjs/project/.next/;
        # }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}