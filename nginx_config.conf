events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	
	server {
		listen 80;
		server_name matveymatvey.ru;

		location / {
			return 301 https://$host$request_uri;
		}

		location ~ /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}
	}

	server {
		listen 443 ssl http2;
		server_name matveymatvey.ru;
		
		ssl_certificate     /etc/letsencrypt/live/matveymatvey.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/matveymatvey.ru/privkey.pem;

		location /velospbot {
			return 301 /velospbot/;
		}

		location /velospbot/ {
			proxy_pass http://velospbot:3000/velospbot;
			proxy_set_header Host  $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# CORS
			add_header 'Access-Control-Allow-Origin' 'https://matveymatvey.ru' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
			add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
		}

		location /velospbot/_next/ {
			proxy_pass http://velospbot:3000/velospbot/_next/;
			proxy_set_header Host  $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# CORS
			add_header 'Access-Control-Allow-Origin' 'https://matveymatvey.ru' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
			add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
		}

		location /api/ {
			proxy_pass http://tg-bot:3001/api/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# CORS
			add_header 'Access-Control-Allow-Origin' 'https://matveymatvey.ru' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE' always;
			add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
			
			# Для предварительных запросов OPTIONS
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' 'https://matveymatvey.ru' always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE' always;
				add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
				add_header 'Access-Control-Max-Age' 1728000;
				add_header 'Content-Type' 'text/plain charset=UTF-8';
				add_header 'Content-Length' 0;
				return 204;
			}
		}

		location ~ /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}
	}
}